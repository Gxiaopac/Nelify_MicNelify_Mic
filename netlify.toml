[build]
  # 仅安装依赖（Python Functions），前端为静态文件
  # 注意：Netlify 会自动为 Functions 安装依赖，这里只安装根目录的依赖（如果需要）
  command = "echo 'Build complete'"
  functions = "netlify/functions"
  publish = "."

[build.environment]
  # 指定 Python 版本（使用 Netlify 可用的预编译版本）
  PYTHON_VERSION = "3.11"
  # 使用 pip 缓存加速
  PIP_CACHE_DIR = ".pip_cache"
  # 禁用 pip 的构建隔离，使用系统包
  PIP_NO_BUILD_ISOLATION = "false"

# Netlify Functions 配置（前端使用 /api/*，内部转发到函数）
# 注意：:splat 会捕获 /api/ 后面的所有内容
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = false

# 静态文件配置
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"


